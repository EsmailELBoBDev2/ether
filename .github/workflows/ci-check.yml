name: CI check
on:
  push:
    branches: [ci-check-all]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./internal/frontends/plex/... ./internal/frontends/silo/... ./internal/frontends/vela/... ./internal/frontend/kit/plextimeline/... ./internal/state/... ./internal/safety/...
      - name: test
        run: go test ./internal/frontends/plex/... ./internal/frontends/silo/... ./internal/frontends/vela/... ./internal/frontend/kit/plextimeline/... ./internal/state/... ./internal/safety/... 2>&1 | tail -150
        shell: bash -o pipefail {0}
