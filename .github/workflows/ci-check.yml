name: CI check
on:
  push:
    branches: [ci-check-themefork]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l internal/)" || { gofmt -d internal/; exit 1; }
      - name: vet
        run: go vet ./internal/frontend/... ./internal/frontends/mediabrowser/... ./internal/app/...
      - name: test
        shell: bash
        run: |
          go test -timeout 25m ./internal/frontend/ ./internal/frontends/mediabrowser/... 2>&1 | grep -E '^(ok|FAIL|---|panic)|_test.go:[0-9]+' | head -60
          exit ${PIPESTATUS[0]}
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: typecheck
        working-directory: web
        run: pnpm typecheck
