# Fork-only: builds a Docker image from a fork/* branch and publishes it to
# this repository's GitHub Container Registry. Upstream releases are published
# by release.yml; this never runs on main or on tags.
name: Fork image

on:
  push:
    branches: ["fork/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Targeted tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Vet the packages this fork changes
        run: go vet ./internal/frontends/mediabrowser/... ./internal/plugins/adapters/...
      - name: Test the packages this fork changes
        run: go test ./internal/frontends/mediabrowser/... ./internal/plugins/adapters/...
      - name: Vet and test the release ranking changes
        run: |
          go vet ./internal/core/... ./internal/newznab/... ./internal/resolver/... ./internal/ratings/... ./internal/transcode/... ./internal/config/... ./internal/sessions/... ./internal/safety/... ./internal/frontends/plex/... ./internal/frontends/silo/... ./internal/frontends/vela/... ./internal/frontend/ ./internal/state/...
          go test -run 'TestIndexerSubtitles' ./internal/newznab/

  image:
    name: Build and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Stage ffmpeg
        run: scripts/fetch-ffmpeg.sh linux-amd64
      - name: Stage Emby Web and Plex Web (private image only)
        # Copied from the official Emby Server and Plex Media Server images at
        # build time. Never committed: this repository is public, the image is
        # private.
        run: |
          set -euo pipefail
          ctx="$RUNNER_TEMP/web-clients"
          mkdir -p "$ctx/emby-web" "$ctx/plex-web" "$RUNNER_TEMP/x"
          emby_image=emby/embyserver:4.10.2.0
          docker pull -q "$emby_image"
          cid=$(docker create "$emby_image")
          docker export "$cid" | tar -x -C "$RUNNER_TEMP/x" --wildcards '*dashboard-ui/*'
          docker rm "$cid" >/dev/null
          src=$(find "$RUNNER_TEMP/x" -type d -name dashboard-ui | head -n1)
          cp -a "$src/." "$ctx/emby-web/"
          # Seven files are served from inside Emby.Web.dll, not the folder:
          # take them from a running Emby Server.
          docker run -d --name emby-web-src -p 127.0.0.1:18096:8096 "$emby_image" >/dev/null
          for i in $(seq 1 90); do curl -fsS -o /dev/null http://127.0.0.1:18096/web/index.html && break; sleep 2; done
          for f in modules/apphost.js modules/iap.js modules/input/keyboard.js \
                   modules/emby-apiclient/connectionmanager.js \
                   modules/registrationservices/registrationservices.js \
                   modules/virtual-scroller/virtual-scroller.js modules/virtual-scroller/virtual-scroller.css; do
            mkdir -p "$(dirname "$ctx/emby-web/$f")"
            curl -fsS "http://127.0.0.1:18096/web/$f" -o "$ctx/emby-web/$f"
          done
          docker rm -f emby-web-src >/dev/null
          test -s "$ctx/emby-web/index.html" && test -s "$ctx/emby-web/modules/apphost.js"
          rm -rf "$RUNNER_TEMP/x" && mkdir -p "$RUNNER_TEMP/x"
          plex_image=plexinc/pms-docker:latest
          docker pull -q "$plex_image"
          cid=$(docker create "$plex_image")
          docker export "$cid" | tar -x -C "$RUNNER_TEMP/x" --wildcards '*WebClient.bundle/Contents/Resources/*'
          docker rm "$cid" >/dev/null
          src=$(find "$RUNNER_TEMP/x" -type d -path '*WebClient.bundle/Contents/Resources' | head -n1)
          cp -a "$src/." "$ctx/plex-web/"
          test -s "$ctx/plex-web/index.html"
          echo "Emby Web: $(find "$ctx/emby-web" -type f | wc -l) files; Plex Web: $(find "$ctx/plex-web" -type f | wc -l) files"
          printf 'ARG BASE\nFROM ${BASE}\nCOPY emby-web/ /usr/share/ether/emby-web/\nCOPY plex-web/ /usr/share/ether/plex-web/\n' > "$ctx/Dockerfile"
      - name: Build and push
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Own package name: an "ether" package may already exist on the account without
          # Actions access to it, which fails the push with permission_denied: write_package.
          image="ghcr.io/${GITHUB_REPOSITORY,,}-fork"
          branch="${GITHUB_REF_NAME#fork/}"
          tag="$(printf '%s' "$branch" | tr -c 'A-Za-z0-9_.-' '-' | cut -c1-100)"
          base="$(ls release-notes | sed -n 's/^v\([0-9][0-9.]*[0-9]\)\.md$/\1/p' | sort -V | tail -n 1)"
          # Non-semver, like upstream's PR preview images (pr-<n>): never mistaken for a release.
          version="fork-${base:-0.0.0}-${RUN_NUMBER}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64 --load --tag ether-base:local \
            --build-arg "VERSION=${version}" --build-arg "COMMIT=${GITHUB_SHA}" .
          docker build --build-arg BASE=ether-base:local \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${version}" \
            --label "org.opencontainers.image.description=Fork build of Ether from ${GITHUB_REF_NAME}" \
            --tag "$image:${tag}" --tag "$image:${tag}-${GITHUB_SHA:0:12}" "$RUNNER_TEMP/web-clients"
          docker push "$image:${tag}"
          docker push "$image:${tag}-${GITHUB_SHA:0:12}"
          {
            echo "### Fork image"
            echo
            echo "- \`$image:${tag}\`"
            echo "- \`$image:${tag}-${GITHUB_SHA:0:12}\`"
            echo "- version \`${version}\`"
          } >> "$GITHUB_STEP_SUMMARY"
