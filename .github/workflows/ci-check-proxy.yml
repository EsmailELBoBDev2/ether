name: CI check
on:
  push:
    branches: [ci-check-proxy]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: format
        working-directory: web
        run: pnpm format:check && pnpm i18n sync && git diff --exit-code
      - name: typecheck
        working-directory: web
        run: pnpm typecheck
      - name: test
        working-directory: web
        shell: bash
        run: pnpm vitest run 2>&1 | grep -E 'FAIL|×|Tests |Test Files|Error|expected|Expected|Received' | head -80; exit ${PIPESTATUS[0]}
