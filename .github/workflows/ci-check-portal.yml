name: CI check
on:
  push:
    branches: [ci-check-portal]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l internal/)" || { gofmt -d internal/; exit 1; }
      - name: vet
        run: go vet ./internal/frontends/mediabrowser/... ./internal/admin/... ./internal/app/... ./internal/config/...
      - name: test
        shell: bash
        run: |
          go test -timeout 25m ./internal/frontends/mediabrowser/... ./internal/frontends/silo/... ./internal/frontends/vela/... ./internal/admin/... ./internal/config/... ./internal/app/... 2>&1 | grep -E '^(ok|FAIL|---|panic)|_test.go:[0-9]+' | head -80
          exit ${PIPESTATUS[0]}
